name: extend the lineage

# The ledger grows one day per day. This runs shortly after 00:00 UTC, advances
# sim/lineage.json to yesterday, and opens a pull request if anything changed.
# Merging it is what makes the new day's clutch descend from the last champion.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: advance the ledger to today
        run: npm run lineage

      - name: prove the ledger still recomputes
        run: npm run lineage --check

      - name: open a pull request if the ledger grew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- sim/lineage.json; then
            echo "the ledger is already current"
            exit 0
          fi
          git config user.name "richard7463"
          git config user.email "richard7463@users.noreply.github.com"
          branch="lineage/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add sim/lineage.json
          git commit -m "Extend the lineage ledger to $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create \
            --title "Extend the lineage ledger" \
            --body "The daily cron advanced \`sim/lineage.json\`. \`npm run lineage --check\` recomputes it from the founder and agrees." \
            --base main --head "$branch"
